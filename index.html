<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; font-src 'self';"
  />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A0C10" />
  <title>Vantage</title>
  <link rel="stylesheet" href="/src/adapters/ui/theme/meridian.generated.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body {
      background-color: var(--pm-canvas);
      color: var(--pm-text-primary);
      font-family: var(--pm-font-sans);
      -webkit-font-smoothing: antialiased;
    }
    .pm-startup {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--pm-space-3);
      padding: var(--pm-space-5);
      text-align: center;
      background: var(--pm-canvas);
      color: var(--pm-text-secondary);
    }
    .pm-startup__brand { color: var(--pm-text-primary); font-size: 24px; font-weight: 600; }
    .pm-startup__title { color: var(--pm-text-primary); font-size: 18px; font-weight: 500; }
    .pm-startup__copy { max-width: 36ch; font-size: 14px; line-height: 1.5; }
    .pm-startup button { padding: var(--pm-space-2) var(--pm-space-4); font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="root">
    <main class="pm-startup" aria-busy="true">
      <div class="pm-startup__brand">Vantage</div>
      <p class="pm-startup__title" role="status">Opening your workspace…</p>
      <p class="pm-startup__copy">Getting your projects ready. This may take a few seconds.</p>
      <noscript>Enable JavaScript to open Vantage.</noscript>
    </main>
  </div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
