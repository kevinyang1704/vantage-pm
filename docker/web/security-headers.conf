# Cross-origin isolation for the in-browser SQLite database (same headers as
# public/_headers and the Vite dev server). Included in every location because
# nginx drops inherited add_header lines in a location that sets its own.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Service-Worker-Allowed "/" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
