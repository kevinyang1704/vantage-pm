[package]
name = "pmapp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Vantage collaboration service — membership, invites, guest identity (Epic 27)"

[dependencies]
pmapp-core = { path = "../pmapp-core" }
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
p256 = { version = "0.13.2", features = ["ecdsa", "ecdsa-core"] }
subtle = "2.6.1"
base64 = "0.23.1"
hmac = "0.12.1"
flate2 = "1.1.10"
# Keep the Linux container on Rustls only. Enabling rustls-tls does not disable
# reqwest's default native TLS backend, which also requires system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
