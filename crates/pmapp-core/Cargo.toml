[package]
name = "pmapp-core"
version = "0.1.0"
description = "Vantage core: Tauri-free protocol, SQLite schema, command handler, workspace registry, migrations, and repository runtime"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
sha2 = "0.10"
hex = "0.4"

chrono = { version = "0.4", default-features = false, features = ["std"] }
