# Vantage collaboration service — Railway config (Story 27.5, D4).
# One service, one replica, a persistent volume at /data, healthcheck /healthz.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "pmapp-server"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
